[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkfail"
dynamic = ["version"]
description = "Link-failure prediction for optical / cloud-scale networks with linear classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3",
    "matplotlib>=3.7", "PyYAML>=6.0", "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
parquet = ["pyarrow>=14"]          # only needed to read .parquet files

# Installs a `linkfail` command in addition to `python -m linkfail`.
[project.scripts]
linkfail = "linkfail.cli:main"

[tool.setuptools]
packages = ["linkfail"]

[tool.setuptools.dynamic]
version = { attr = "linkfail.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
